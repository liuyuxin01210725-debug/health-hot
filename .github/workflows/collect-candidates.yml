name: 每周健康候选采集

on:
  schedule:
    # GitHub Actions cron 使用 UTC：每周一 00:00 UTC = 北京时间周一 08:00。
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  collect:
    name: 抓取候选并生成审核清单
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 抓取官方目录与 PubMed 候选
        id: collect
        continue-on-error: true
        run: |
          set -o pipefail
          python3 collect.py 2>&1 | tee /tmp/health_candidates.log

      - name: 生成审核摘要
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path

          candidates_file = Path("/tmp/health_candidates.json")
          meta_file = Path("/tmp/health_collection_meta.json")
          report_file = Path("/tmp/health_candidates_report.md")
          outcome = os.environ["COLLECTION_OUTCOME"]
          run_url = os.environ["RUN_URL"]
          today = date.today().isoformat()

          if candidates_file.exists():
              candidates = json.loads(candidates_file.read_text(encoding="utf-8"))
          else:
              candidates = []
          if meta_file.exists():
              collection_meta = json.loads(meta_file.read_text(encoding="utf-8"))
          else:
              collection_meta = {}
          source_failures = collection_meta.get("failures") or []

          def clean(value):
              return str(value or "").replace("\n", " ").strip()

          def is_pubmed(item):
              return "pubmed.ncbi.nlm.nih.gov" in clean(item.get("source_url"))

          def is_official(item):
              return item.get("authority_level") == "official"

          def warning_flags(item):
              flags = []
              published = clean(item.get("published"))
              if published and published > today:
                  flags.append("⚠ 未来排期")
              if item.get("relevance_hint") == "query_match_only":
                  flags.append("⚠ 标题弱相关")
              if not clean(item.get("desc")):
                  flags.append("⚠ 摘要为空")
              return flags

          def append_items(lines, items):
              if not items:
                  lines.append("无。")
                  return
              for index, item in enumerate(items, start=1):
                  title = clean(item.get("title")) or "无标题"
                  source = clean(item.get("source")) or "来源待核"
                  published = clean(item.get("published")) or "日期待核"
                  role = clean(item.get("role")) or "角色待核"
                  evidence = clean(item.get("evidence")) or "证据待核"
                  tier = clean(item.get("discovery_tier"))
                  url = clean(item.get("source_url"))
                  citations = [clean(value) for value in (item.get("citation_urls_to_review") or []) if clean(value)]
                  context_urls = [clean(value) for value in (item.get("context_urls_to_review") or []) if clean(value)]
                  reference_page = clean(item.get("reference_page_url"))
                  enrichment_error = clean(item.get("reference_enrichment_error"))
                  flags = warning_flags(item)
                  flag_text = f" · {' · '.join(flags)}" if flags else ""
                  lines.append(f"{index}. **{title}**{flag_text}")
                  tier_text = f" · `{tier}`" if tier else ""
                  lines.append(f"   `{source}` · `{published}` · `{role}` · `{evidence}`{tier_text}")
                  if url:
                      lines.append(f"   原文：{url}")
                  if reference_page:
                      lines.append(f"   专家详情页：{reference_page}")
                  for citation in citations[:5]:
                      lines.append(f"   待核引用：{citation}")
                  if len(citations) > 5:
                      lines.append(f"   待核引用：其余 {len(citations) - 5} 个见 Artifact JSON")
                  if context_urls:
                      lines.append(f"   简介上下文链接：{len(context_urls)} 个（可能含内部导航或赞助，见 Artifact JSON）")
                  if enrichment_error:
                      lines.append(f"   引用深挖告警：{enrichment_error}")

          official = [item for item in candidates if is_official(item)]
          anchors = [item for item in candidates if item.get("role") == "anchor" and item not in official]
          pubmed_radar = [item for item in candidates if item.get("role") == "radar" and is_pubmed(item)]
          discovery = [item for item in candidates if item.get("discovery_tier") == "trusted_expert"]
          experimental = [item for item in candidates if item.get("discovery_tier") == "experimental_self_report"]
          warnings = [item for item in candidates if warning_flags(item)]
          ungrouped = [item for item in candidates if item not in official and item not in anchors and item not in pubmed_radar and item not in discovery and item not in experimental]
          status = "成功" if outcome == "success" else "失败：请先查看日志，不要进入发布流程"
          lines = [
              "# 每周健康候选采集",
              "",
              f"- 状态：**{status}**",
              f"- 新候选：**{len(candidates)} 条**",
              f"- 官方事实页 / 指南：**{len(official)} 条** · PubMed 锚点：**{len(anchors)} 条** · PubMed 趋势雷达：**{len(pubmed_radar)} 条** · 专家解释 / 前沿发现：**{len(discovery)} 条** · 实验型个人方案：**{len(experimental)} 条**",
              f"- 发现层抓取告警：**{len(source_failures)} 个**",
              f"- 需重点人工检查：**{len(warnings)} 条**",
              f"- Actions 运行记录：[打开本次运行]({run_url})",
              "- 完整文件：在本次运行页面下载 `health-candidates` Artifact",
              "",
              "> 这是审核收件箱，不是发布清单。默认采集官方机构、PubMed 和可信专家解释层。专家节目能更早提出值得追踪的问题，但不能自动冒充研究结论；简介里提取的链接也只是待核引用。先处理风险提醒，再补齐证据链。",
              "",
              "## 0. 风险提醒",
              "",
          ]
          append_items(lines, warnings)
          lines.extend(["", "## A. 官方事实页 / 指南常青候选", ""])
          append_items(lines, official)
          lines.extend(["", "## B. PubMed 研究 / 指南锚点候选（仍需判断选题价值）", ""])
          append_items(lines, anchors)
          lines.extend(["", "## C. PubMed 趋势雷达", ""])
          append_items(lines, pubmed_radar)
          lines.extend(["", "## D. 专家解释 / 前沿发现层（播客 / 视频 / 博客，不直接定结论）", ""])
          append_items(lines, discovery)
          lines.extend(["", "## D1. 实验型个人方案雷达（单独标注，不直接定结论）", ""])
          append_items(lines, experimental)
          if source_failures:
              lines.extend(["", "## D2. 发现层抓取告警（不阻断官方 / PubMed 主流程）", ""])
              for item in source_failures:
                  lines.append(f"- `{clean(item.get('source')) or '来源待核'}` · `{clean(item.get('role')) or '角色待核'}` · {clean(item.get('error')) or '错误待核'}")
          if ungrouped:
              lines.extend(["", "## E. 未分组候选", ""])
              append_items(lines, ungrouped)

          report = "\n".join(lines) + "\n"
          report_file.write_text(report, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          PY

      - name: 审计已发布馆藏
        if: always()
        run: |
          set -o pipefail
          audit_status=0
          python3 audit_library.py --check-links 2>&1 | tee /tmp/health_library_audit.log || audit_status=$?
          cat /tmp/health_library_audit_report.md >> /tmp/health_candidates_report.md
          cat /tmp/health_library_audit_report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$audit_status"

      - name: 保存候选与采集日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health-candidates
          path: |
            /tmp/health_candidates.json
            /tmp/health_collection_meta.json
            /tmp/health_candidates.log
            /tmp/health_candidates_report.md
            /tmp/health_library_audit.json
            /tmp/health_library_audit.log
            /tmp/health_library_audit_report.md
          if-no-files-found: warn
          retention-days: 30

      - name: 刷新 GitHub 审核收件箱
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(
            gh issue list \
              --state open \
              --search '"每周健康候选采集" in:title' \
              --json number,title \
              --jq '.[] | select(.title == "每周健康候选采集") | .number' \
              | head -n 1
          )"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file /tmp/health_candidates_report.md
          else
            gh issue create --title "每周健康候选采集" --body-file /tmp/health_candidates_report.md
          fi

      - name: 采集不完整时阻止后续发布
        if: steps.collect.outcome != 'success'
        run: |
          echo "部分或全部信源采集失败。候选与日志已保存，但本次任务按失败处理。"
          exit 1
