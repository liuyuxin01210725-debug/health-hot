name = "health-hot-submit"
main = "src/worker.js"
compatibility_date = "2026-06-04"
workers_dev = true
preview_urls = false

[vars]
GITHUB_REPO = "liuyuxin01210725-debug/health-hot"
GITHUB_LABEL = "待核说法"
ALLOWED_ORIGINS = "https://health-hot.vercel.app,https://liuyuxin01210725-debug.github.io,http://localhost:8000,http://127.0.0.1:8000"
EVENT_DAILY_LIMIT_PER_IP = "300"
# EVENT_STATS_TOKEN 用于保护 GET /event/stats 读回；走 secret、不写进配置/仓库：
#   npx wrangler secret put EVENT_STATS_TOKEN   （Pages 项目则在 Cloudflare 后台环境变量里设）

# 去重 + 限流 + 重复计数所需。先建命名空间再填 id：
#   npx wrangler kv namespace create PENDING_KV
# 把返回的 id 填到下面（submit-pages/wrangler.toml 也要填同一个 id），再部署。
[[kv_namespaces]]
binding = "PENDING_KV"
id = "bb924e36c923466a9a848d29c7236bc8"
